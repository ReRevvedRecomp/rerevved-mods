name: Bug report
description: Report a problem with ReRevved Mods
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: |
        Describe the problem, what you expected, and how to reproduce it. For a
        mod-specific issue, name the mod and version. Include your ReRevved
        version, operating system, other enabled mods, and useful logs or
        screenshots when relevant. Do not upload retail files or extracted
        assets.
    validations:
      required: true
